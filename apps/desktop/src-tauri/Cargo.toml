[package]
name = "desktop"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Tauri shell for oca: a React/TypeScript webview frontend over the avcore engine."

[[bin]]
name = "oca-desktop"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
# Package name is `core`; Rust code imports it as `avcore` (see crates/core/Cargo.toml).
core = { path = "../../../crates/core" }
tauri = { version = "2.12", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1.0"
rmp-serde = "1"
rmpv = { version = "1", features = ["with-serde"] }
# Native open/save dialogs, same crate and major version the egui shell already uses.
rfd = "0.17.2"
# Preview frames and media thumbnails cross the IPC boundary as JPEG: a 1080p RGBA frame is
# ~8 MB raw, which the webview cannot ingest at playback rate over a custom protocol.
image = { version = "0.25.10", default-features = false, features = ["jpeg"] }
# Preview frames are encoded 30+ times a second; this encoder subsamples chroma and has an AVX2
# path, several times faster than `image`'s 4:4:4 JPEG encoder on a 1280x720 frame.
jpeg-encoder = { version = "0.7", features = ["simd"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"
# ER-01B error-report delivery transport, same crate/major version the egui shell already uses.
ureq = "3"
# Channel primitives only (no task runtime) -- same "sync"-only feature set crates/ui pins, per
# CLAUDE.md's "background work is plain std::thread::spawn, not tokio tasks" convention.
tokio = { version = "1", features = ["sync"] }
# Bush, the native preview engine (spec/matrix/bush.md): software decode and CPU compositing by
# default, wgpu compositing opt-in (`OCA_BUSH_RENDERER=gpu`), cpal for the audio device.
bush = { path = "../../../crates/bush", features = ["gpu", "cpal"] }

[dev-dependencies]
# `tauri::test::mock_app` runs commands against a mock runtime instead of a real window.
tauri = { version = "2.12", features = ["test"] }
