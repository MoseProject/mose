version: 2.1

orbs:
  codecov: codecov/codecov@6.0.0

# FFmpeg release pinning for supply-chain security, mirrored from
# .github/workflows/ci.yml — update both together when upgrading FFmpeg.
# See .github/FFMPEG_UPDATE.md for detailed instructions.
parameters:
  ffmpeg-release-tag:
    type: string
    default: "autobuild-2026-10-01-13-06"
  ffmpeg-build-id:
    type: string
    default: "n8.1.3-14-g330caae0c1"
  ffmpeg-linux64-sha256:
    type: string
    default: "53c73537be6421f793bb5c0ffbeef2d13498100691adab91a9e5fa9245b31cb9"
  # Prebuilt binaries (not `cargo install`, which compiles from source and was taking ~3min
  # per run on its own). SHA256s computed locally from the pinned release assets below —
  # neither project publishes its own checksum file — same verify-before-use posture as the
  # FFmpeg download above.
  cargo-llvm-cov-version:
    type: string
    default: "0.9.0"
  cargo-llvm-cov-linux64-sha256:
    type: string
    default: "b068f7c98841aacb9c4f382b4a0c184ae82f49b56a32d442b429b2961c73be15"
  cargo-nextest-version:
    type: string
    default: "0.9.143"
  cargo-nextest-linux64-sha256:
    type: string
    default: "66786b9abe23920d022a182d1416b1bbc8130dd4872a9553d76985a1708dcd1e"
  sccache-version:
    type: string
    default: "0.17.0"
  sccache-linux64-sha256:
    type: string
    default: "67c4a96dd237c1f518f6b36083f270f9976d516f1e57fce891755ea782e50006"
  # Keep the toolchain explicit rather than floating on "stable". The Ubuntu 24.04 base image
  # is selected separately below because ONNX Runtime's prebuilt static archive requires a
  # newer glibc/libstdc++ than the Ubuntu 22.04-based cimg/rust image provides.
  rust-version:
    type: string
    default: "1.99.0"

executors:
  linux:
    docker:
      - image: cimg/base:2026.01
    resource_class: medium

commands:
  # Shared by the quality and coverage jobs: native toolchain/library setup and only the
  # dependency caches that are smaller than the work they avoid. In particular, do not cache
  # `target/`: revision-keyed build outputs dominated storage and took longer to transfer than
  # Cargo needed to rebuild them.
  setup-native-deps:
    steps:
      - run:
          name: Install pinned Rust toolchain
          command: |
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
              | sh -s -- -y --default-toolchain << pipeline.parameters.rust-version >> \
                --profile default
            echo 'export PATH="$HOME/.cargo/bin:$PATH"' >> "$BASH_ENV"

      # libclang/cmake are needed by bindgen-based build scripts in core's dependency tree —
      # whisper-rs (transcription)
      # links vendored C/C++ sources through bindgen, which needs a real libclang.so to
      # parse headers. GitHub's ubuntu-latest runner ships this preinstalled (CLAUDE.md never
      # had to set LIBCLANG_PATH there); cimg/base doesn't, hence installing + pointing at it
      # explicitly here.
      - run:
          name: Install ALSA headers, Python, clang and cmake
          command: |
            sudo apt-get update
            sudo apt-get install -y \
              pkg-config \
              libasound2-dev \
              python3-dev \
              clang \
              libclang-dev \
              cmake

            # The image includes the Python 3.10 interpreter and versioned runtime library,
            # but not the unversioned libpython3.10.so linker input required by pyo3's
            # auto-initialize/embedding mode in ytbridge. python3-dev supplies the matching
            # development library without pinning this config to the image's minor version.

            # Prefer the canonical llvm-<version>/lib dir: Ubuntu's libclang-dev pulls in a
            # versioned llvm-N package that ships the full generic-named set bindgen's
            # clang-sys expects there (libclang.so, libclang.so.<N>, libclang-N.so, ...).
            # Fall back to scanning all of /usr/lib (multiarch dirs only carry the
            # libclang-N.so* names, no unversioned libclang.so) in case that layout ever
            # changes on a future base image.
            libclang_path=$(find /usr/lib/llvm-*/lib -maxdepth 1 -name 'libclang.so*' 2>/dev/null | head -1 | xargs -r dirname)
            if [ -z "$libclang_path" ]; then
              libclang_path=$(find /usr/lib \( -name 'libclang-*.so*' -o -name 'libclang.so*' \) 2>/dev/null | head -1 | xargs -r dirname)
            fi
            if [ -z "$libclang_path" ]; then
              echo "Could not locate libclang.so under /usr/lib after installing libclang-dev" >&2
              echo "--- /usr/lib/llvm-*/lib contents (if any) ---" >&2
              ls /usr/lib/llvm-*/lib 2>&1 >&2 || true
              exit 1
            fi
            echo "Using LIBCLANG_PATH=$libclang_path"
            echo "export LIBCLANG_PATH=$libclang_path" >> "$BASH_ENV"

      # sccache caches dependency compilation across runs (a changed Cargo.lock only rebuilds the
      # crates that changed). Its compiled-output store is cached below instead of `target/`,
      # which the comment above explains is too big to be worth transferring.
      - restore_cache:
          keys:
            - v1-sccache-bin-<< pipeline.parameters.sccache-version >>

      - run:
          name: Download and verify sccache (prebuilt binary)
          command: |
            mkdir -p cargo-tools
            if [ ! -x cargo-tools/sccache ]; then
              sccache_version="<< pipeline.parameters.sccache-version >>"
              sccache_sha256="<< pipeline.parameters.sccache-linux64-sha256 >>"
              dir="sccache-v${sccache_version}-x86_64-unknown-linux-musl"
              curl -fsSL -o sccache.tar.gz "https://github.com/mozilla/sccache/releases/download/v${sccache_version}/${dir}.tar.gz"
              actual=$(sha256sum sccache.tar.gz | awk '{print $1}')
              if [ "$actual" != "$sccache_sha256" ]; then
                echo "sccache checksum mismatch! Expected: $sccache_sha256, Got: $actual" >&2
                exit 1
              fi
              tar -xzf sccache.tar.gz -C cargo-tools --strip-components=1 "${dir}/sccache"
              chmod +x cargo-tools/sccache
            fi
            {
              echo "export PATH=$(pwd)/cargo-tools:\$PATH"
              echo "export RUSTC_WRAPPER=$(pwd)/cargo-tools/sccache"
              echo "export SCCACHE_DIR=$HOME/.cache/sccache"
              echo "export SCCACHE_CACHE_SIZE=2G"
            } >> "$BASH_ENV"

      - save_cache:
          key: v1-sccache-bin-<< pipeline.parameters.sccache-version >>
          paths:
            - cargo-tools/sccache

      - restore_cache:
          name: Restore sccache objects
          keys:
            - v1-sccache-objects-{{ .Environment.CIRCLE_JOB }}-{{ checksum "Cargo.lock" }}
            - v1-sccache-objects-{{ .Environment.CIRCLE_JOB }}-

      - restore_cache:
          name: Restore Cargo registry
          keys:
            - v3-cargo-registry-{{ checksum "Cargo.lock" }}

      # This tool is not in Cargo.lock, so cache the small verified binary independently.
      - restore_cache:
          keys:
            - v3-cargo-nextest-<< pipeline.parameters.cargo-nextest-version >>

      - run:
          name: Download and verify cargo-nextest (prebuilt binary)
          command: |
            mkdir -p cargo-tools
            if [ -x cargo-tools/cargo-nextest ]; then
              echo "cargo-nextest already cached, skipping download."
            else
              nextest_version="<< pipeline.parameters.cargo-nextest-version >>"
              nextest_sha256="<< pipeline.parameters.cargo-nextest-linux64-sha256 >>"
              curl -fsSL -o nextest.tar.gz "https://get.nexte.st/${nextest_version}/x86_64-unknown-linux-gnu.tar.gz"
              actual=$(sha256sum nextest.tar.gz | awk '{print $1}')
              if [ "$actual" != "$nextest_sha256" ]; then
                echo "cargo-nextest checksum mismatch! Expected: $nextest_sha256, Got: $actual" >&2
                exit 1
              fi
              tar -xzf nextest.tar.gz -C cargo-tools
              chmod +x cargo-tools/cargo-nextest
            fi

            echo "export PATH=$(pwd)/cargo-tools:\$PATH" >> "$BASH_ENV"

      - save_cache:
          key: v3-cargo-nextest-<< pipeline.parameters.cargo-nextest-version >>
          paths:
            - cargo-tools

      - restore_cache:
          keys:
            - ffmpeg-btbn-linux64-lgpl-shared-<< pipeline.parameters.ffmpeg-release-tag >>-<< pipeline.parameters.ffmpeg-linux64-sha256 >>

      # Pin to a specific release and verify SHA256 checksum before extraction to prevent
      # code execution from tampered native libraries. To update FFmpeg:
      # 1. Find a release tag at https://github.com/BtbN/FFmpeg-Builds/releases
      # 2. Download the asset and compute its SHA256:
      #    sha256sum ffmpeg-master-latest-linux64-gpl-shared.tar.xz
      # 3. Update the ffmpeg-* pipeline parameters above (and .github/workflows/ci.yml's
      #    matching env vars, kept in sync manually).
      # See .github/FFMPEG_UPDATE.md for detailed instructions.
      - run:
          name: Download and verify FFmpeg dev build (BtbN)
          command: |
            if [ -d ffmpeg-dev ]; then
              echo "FFmpeg dev build already cached, skipping download."
              exit 0
            fi

            release_tag="<< pipeline.parameters.ffmpeg-release-tag >>"
            expected_sha256="<< pipeline.parameters.ffmpeg-linux64-sha256 >>"

            if [[ "$expected_sha256" == *"PLACEHOLDER"* ]]; then
              echo "ffmpeg-linux64-sha256 contains a placeholder value." >&2
              echo "Please update the parameters in .circleci/config.yml" >&2
              echo "See .github/FFMPEG_UPDATE.md for instructions." >&2
              exit 1
            fi

            build_id="<< pipeline.parameters.ffmpeg-build-id >>"
            uri="https://github.com/BtbN/FFmpeg-Builds/releases/download/${release_tag}/ffmpeg-${build_id}-linux64-lgpl-shared-8.1.tar.xz"
            max_attempts=5
            for attempt in $(seq 1 $max_attempts); do
              if curl -fsSL -o ffmpeg.tar.xz "$uri"; then
                break
              fi
              if [ "$attempt" -eq "$max_attempts" ]; then
                echo "Download failed after $max_attempts attempts" >&2
                exit 1
              fi
              delay=$((15 * attempt))
              echo "Download failed (attempt $attempt/$max_attempts). Retrying in ${delay}s..."
              sleep "$delay"
            done

            actual_sha256=$(sha256sum ffmpeg.tar.xz | awk '{print $1}')
            if [ "$actual_sha256" != "$expected_sha256" ]; then
              echo "FFmpeg checksum mismatch! Expected: $expected_sha256, Got: $actual_sha256" >&2
              echo "This may indicate a compromised download or an outdated checksum." >&2
              exit 1
            fi
            echo "FFmpeg checksum verified: $actual_sha256"
            tar -xf ffmpeg.tar.xz
            dir=$(find . -maxdepth 1 -name 'ffmpeg-*' -type d | head -1)
            mv "$dir" ffmpeg-dev

      - save_cache:
          key: ffmpeg-btbn-linux64-lgpl-shared-<< pipeline.parameters.ffmpeg-release-tag >>-<< pipeline.parameters.ffmpeg-linux64-sha256 >>
          paths:
            - ffmpeg-dev

      # FFMPEG_DIR must point at an extracted BtbN build whose include/ and lib/ match
      # what avbridge/build.rs expects. LD_LIBRARY_PATH lets the test runner find the
      # shared libs at runtime without a system-wide install.
      - run:
          name: Export FFMPEG_DIR and LD_LIBRARY_PATH
          command: |
            echo "export FFMPEG_DIR=$(pwd)/ffmpeg-dev" >> "$BASH_ENV"
            echo "export LD_LIBRARY_PATH=$(pwd)/ffmpeg-dev/lib\${LD_LIBRARY_PATH:+:\$LD_LIBRARY_PATH}" >> "$BASH_ENV"

      - run:
          name: Verify Linux VAAPI encoder is bundled
          command: |
            if ! ffmpeg-dev/bin/ffmpeg -hide_banner -encoders 2>/dev/null \
                | grep '[[:space:]]h264_vaapi[[:space:]]' >/dev/null; then
              echo "Pinned Linux FFmpeg build does not include h264_vaapi" >&2
              exit 1
            fi

  install-coverage-tool:
    steps:
      # Keep this out of the pull-request quality job: LLVM coverage instrumentation is
      # substantially slower and the verifier only needs it on the protected branch.
      - restore_cache:
          keys:
            - v3-cargo-llvm-cov-<< pipeline.parameters.cargo-llvm-cov-version >>

      - run:
          name: Download and verify cargo-llvm-cov (prebuilt binary)
          command: |
            rustup component add llvm-tools-preview
            mkdir -p cargo-tools
            if [ -x cargo-tools/cargo-llvm-cov ]; then
              echo "cargo-llvm-cov already cached, skipping download."
            else
              llvm_cov_version="<< pipeline.parameters.cargo-llvm-cov-version >>"
              llvm_cov_sha256="<< pipeline.parameters.cargo-llvm-cov-linux64-sha256 >>"
              curl -fsSL -o llvm-cov.tar.gz "https://github.com/taiki-e/cargo-llvm-cov/releases/download/v${llvm_cov_version}/cargo-llvm-cov-x86_64-unknown-linux-gnu.tar.gz"
              actual=$(sha256sum llvm-cov.tar.gz | awk '{print $1}')
              if [ "$actual" != "$llvm_cov_sha256" ]; then
                echo "cargo-llvm-cov checksum mismatch! Expected: $llvm_cov_sha256, Got: $actual" >&2
                exit 1
              fi
              tar -xzf llvm-cov.tar.gz -C cargo-tools
              chmod +x cargo-tools/cargo-llvm-cov
            fi
            echo "export PATH=$(pwd)/cargo-tools:\$PATH" >> "$BASH_ENV"

      - save_cache:
          key: v3-cargo-llvm-cov-<< pipeline.parameters.cargo-llvm-cov-version >>
          paths:
            - cargo-tools/cargo-llvm-cov

jobs:
  quality:
    executor: linux
    retention:
      caches: 3d
    environment:
      CARGO_TERM_COLOR: always
    steps:
      - checkout
      - setup-native-deps

      - run:
          name: Check formatting
          command: |
            source "$BASH_ENV"
            cargo fmt --all -- --check

      - run:
          name: Clippy
          command: |
            source "$BASH_ENV"
            cargo clippy --workspace --all-targets

      - run:
          name: Test
          command: |
            source "$BASH_ENV"
            cargo nextest run --workspace --profile ci

      - save_cache:
          name: Save Cargo registry
          key: v3-cargo-registry-{{ checksum "Cargo.lock" }}
          paths:
            - ~/.cargo/registry

      - save_cache:
          name: Save sccache objects
          key: v1-sccache-objects-{{ .Environment.CIRCLE_JOB }}-{{ checksum "Cargo.lock" }}
          paths:
            - ~/.cache/sccache

  coverage:
    executor: linux
    retention:
      caches: 3d
    environment:
      CARGO_TERM_COLOR: always
    steps:
      - checkout
      - setup-native-deps
      - install-coverage-tool

      - run:
          name: Test with coverage
          command: |
            source "$BASH_ENV"
            find target/llvm-cov-target -type f -name '*.profraw' -delete 2>/dev/null || true
            cargo llvm-cov nextest --workspace --no-clean --lcov --output-path lcov.info --profile ci
            test -s lcov.info

      - save_cache:
          name: Save Cargo registry
          key: v3-cargo-registry-{{ checksum "Cargo.lock" }}
          paths:
            - ~/.cargo/registry

      - save_cache:
          name: Save sccache objects
          key: v1-sccache-objects-{{ .Environment.CIRCLE_JOB }}-{{ checksum "Cargo.lock" }}
          paths:
            - ~/.cache/sccache

      - codecov/upload:
          disable_search: true
          fail_on_error: false
          files: lcov.info
          flags: rust
          token: CODECOV_TOKEN
          upload_name: rust-coverage

workflows:
  ci:
    jobs:
      - quality
      - coverage:
          filters: pipeline.git.branch == "main"
