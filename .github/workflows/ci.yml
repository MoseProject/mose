name: CI

on:
  workflow_dispatch: {}
  # push/pull_request triggers disabled — no CI credits available right now.
  # Restore the block below to re-enable automatic runs:
  # push:
  #   branches: [main]
  # pull_request:
  #   branches: [main]

env:
  CARGO_TERM_COLOR: always
  # FFmpeg release pinning for supply-chain security. These must be updated together when
  # upgrading FFmpeg. See .github/FFMPEG_UPDATE.md for detailed instructions.
  FFMPEG_RELEASE_TAG: "autobuild-2026-10-01-13-06"
  FFMPEG_BUILD_ID: "n8.1.3-14-g330caae0c1"
  FFMPEG_WIN64_SHA256: "bf545d8fee9bb6957c1f3dea0f384bf64edead407d763326dbbd2de1b04768a4"
  FFMPEG_LINUX64_SHA256: "53c73537be6421f793bb5c0ffbeef2d13498100691adab91a9e5fa9245b31cb9"

jobs:
  build-and-test-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy, llvm-tools-preview

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Cache FFmpeg dev build
        id: ffmpeg-cache
        uses: actions/cache@v6
        with:
          path: ffmpeg-dev
          key: ffmpeg-btbn-win64-lgpl-shared-${{ env.FFMPEG_RELEASE_TAG }}-${{ env.FFMPEG_WIN64_SHA256 }}

      # Pin to a specific release and verify SHA256 checksum before extraction to prevent
      # code execution from tampered native libraries. To update FFmpeg:
      # 1. Find a release tag at https://github.com/BtbN/FFmpeg-Builds/releases
      # 2. Download the asset and compute its SHA256:
      #    Get-FileHash -Algorithm SHA256 ffmpeg-master-latest-win64-gpl-shared.zip
      # 3. Update FFMPEG_RELEASE_TAG and FFMPEG_WIN64_SHA256 in the env section above
      # See .github/FFMPEG_UPDATE.md for detailed instructions.
      - name: Download and verify FFmpeg dev build (BtbN)
        if: steps.ffmpeg-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          $releaseTag = "${{ env.FFMPEG_RELEASE_TAG }}"
          $expectedSha256 = "${{ env.FFMPEG_WIN64_SHA256 }}"
          
          # Fail fast if placeholder values haven't been replaced
          if ($expectedSha256 -like "*PLACEHOLDER*") {
            Write-Error "FFMPEG_WIN64_SHA256 contains a placeholder value."
            Write-Error "Please update the checksums in .github/workflows/ci.yml"
            Write-Error "See .github/FFMPEG_UPDATE.md for instructions."
            exit 1
          }
          
          $buildId = "${{ env.FFMPEG_BUILD_ID }}"
          $uri = "https://github.com/BtbN/FFmpeg-Builds/releases/download/$releaseTag/ffmpeg-$buildId-win64-lgpl-shared-8.1.zip"
          $maxAttempts = 5
          for ($attempt = 1; $attempt -le $maxAttempts; $attempt++) {
            try {
              Invoke-WebRequest -Uri $uri -OutFile ffmpeg.zip
              break
            } catch {
              if ($attempt -eq $maxAttempts) { throw }
              $delay = 15 * $attempt
              Write-Host "Download failed (attempt $attempt/$maxAttempts): $($_.Exception.Message). Retrying in $delay s..."
              Start-Sleep -Seconds $delay
            }
          }
          $actualSha256 = (Get-FileHash -Algorithm SHA256 ffmpeg.zip).Hash
          if ($actualSha256 -ne $expectedSha256) {
            Write-Error "FFmpeg checksum mismatch! Expected: $expectedSha256, Got: $actualSha256"
            Write-Error "This may indicate a compromised download or an outdated checksum."
            exit 1
          }
          Write-Host "FFmpeg checksum verified: $actualSha256"
          Expand-Archive -Path ffmpeg.zip -DestinationPath ffmpeg-extracted
          $inner = Get-ChildItem ffmpeg-extracted | Select-Object -First 1
          Move-Item $inner.FullName ffmpeg-dev

      - name: Export FFMPEG_DIR and PATH
        shell: pwsh
        run: |
          $ffmpegDir = (Resolve-Path "ffmpeg-dev").Path
          echo "FFMPEG_DIR=$ffmpegDir" >> $env:GITHUB_ENV
          echo "$ffmpegDir\bin" >> $env:GITHUB_PATH

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets

      - name: Build
        run: cargo build --workspace

      - name: Test with coverage
        run: cargo llvm-cov --workspace --lcov --output-path lcov.info

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          files: lcov.info
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

  build-and-test-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      # ALSA headers are needed by `cpal`, the audio output backend of the Bush preview.
      - name: Install system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libasound2-dev

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Cache FFmpeg dev build
        id: ffmpeg-cache
        uses: actions/cache@v6
        with:
          path: ffmpeg-dev
          key: ffmpeg-btbn-linux64-lgpl-shared-${{ env.FFMPEG_RELEASE_TAG }}-${{ env.FFMPEG_LINUX64_SHA256 }}

      # Pin to a specific release and verify SHA256 checksum before extraction to prevent
      # code execution from tampered native libraries. To update FFmpeg:
      # 1. Find a release tag at https://github.com/BtbN/FFmpeg-Builds/releases
      # 2. Download the asset and compute its SHA256:
      #    sha256sum ffmpeg-master-latest-linux64-gpl-shared.tar.xz
      # 3. Update FFMPEG_RELEASE_TAG and FFMPEG_LINUX64_SHA256 in the env section above
      # See .github/FFMPEG_UPDATE.md for detailed instructions.
      - name: Download and verify FFmpeg dev build (BtbN)
        if: steps.ffmpeg-cache.outputs.cache-hit != 'true'
        run: |
          release_tag="${{ env.FFMPEG_RELEASE_TAG }}"
          expected_sha256="${{ env.FFMPEG_LINUX64_SHA256 }}"
          
          # Fail fast if placeholder values haven't been replaced
          if [[ "$expected_sha256" == *"PLACEHOLDER"* ]]; then
            echo "FFMPEG_LINUX64_SHA256 contains a placeholder value." >&2
            echo "Please update the checksums in .github/workflows/ci.yml" >&2
            echo "See .github/FFMPEG_UPDATE.md for instructions." >&2
            exit 1
          fi
          
          build_id="${{ env.FFMPEG_BUILD_ID }}"
          uri="https://github.com/BtbN/FFmpeg-Builds/releases/download/${release_tag}/ffmpeg-${build_id}-linux64-lgpl-shared-8.1.tar.xz"
          max_attempts=5
          for attempt in $(seq 1 $max_attempts); do
            if curl -fsSL -o ffmpeg.tar.xz "$uri"; then
              break
            fi
            if [ "$attempt" -eq "$max_attempts" ]; then
              echo "Download failed after $max_attempts attempts" >&2
              exit 1
            fi
            delay=$((15 * attempt))
            echo "Download failed (attempt $attempt/$max_attempts). Retrying in ${delay}s..."
            sleep "$delay"
          done
          actual_sha256=$(sha256sum ffmpeg.tar.xz | awk '{print $1}')
          if [ "$actual_sha256" != "$expected_sha256" ]; then
            echo "FFmpeg checksum mismatch! Expected: $expected_sha256, Got: $actual_sha256" >&2
            echo "This may indicate a compromised download or an outdated checksum." >&2
            exit 1
          fi
          echo "FFmpeg checksum verified: $actual_sha256"
          tar -xf ffmpeg.tar.xz
          dir=$(find . -maxdepth 1 -name 'ffmpeg-*' -type d | head -1)
          mv "$dir" ffmpeg-dev

      # FFMPEG_DIR must point at an extracted BtbN build whose include/ and lib/ match
      # what avbridge/build.rs expects. LD_LIBRARY_PATH lets the test runner find the
      # shared libs at runtime without a system-wide install.
      - name: Export FFMPEG_DIR and LD_LIBRARY_PATH
        run: |
          echo "FFMPEG_DIR=$(pwd)/ffmpeg-dev" >> "$GITHUB_ENV"
          echo "LD_LIBRARY_PATH=$(pwd)/ffmpeg-dev/lib${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}" >> "$GITHUB_ENV"

      - name: Verify Linux VAAPI encoder is bundled
        run: |
          if ! ffmpeg-dev/bin/ffmpeg -hide_banner -encoders 2>/dev/null \
              | grep '[[:space:]]h264_vaapi[[:space:]]' >/dev/null; then
            echo "Pinned Linux FFmpeg build does not include h264_vaapi" >&2
            exit 1
          fi

      - name: Clippy
        run: cargo clippy --workspace --all-targets

      - name: Build
        run: cargo build --workspace

      - name: Test
        run: cargo test --workspace

  build-and-test-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      # Homebrew FFmpeg gives us include/ and lib/ under $(brew --prefix)/opt/ffmpeg, which
      # is exactly the layout avbridge/build.rs expects from FFMPEG_DIR.
      - name: Install dependencies
        run: brew install ffmpeg

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Export FFMPEG_DIR
        run: |
          brew_prefix=$(brew --prefix)
          echo "FFMPEG_DIR=${brew_prefix}/opt/ffmpeg" >> "$GITHUB_ENV"

      - name: Clippy
        run: cargo clippy --workspace --all-targets

      - name: Build
        run: cargo build --workspace

      - name: Test
        run: cargo test --workspace
