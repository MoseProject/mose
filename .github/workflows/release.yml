name: Release complete bundles

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  GSTREAMER_VERSION: "1.26.11"

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: Install native build tools
        shell: pwsh
        run: choco install pkgconfiglite cmake llvm -y --no-progress
      - name: Install GStreamer SDK and runtime
        uses: blinemedical/setup-gstreamer@v1.4.0
        with:
          version: ${{ env.GSTREAMER_VERSION }}
          arch: x86_64
      - uses: Swatinem/rust-cache@v2
      - name: Fetch locked Cargo sources for license generation
        run: cargo fetch --locked

      - name: Prepare verified private Python runtime
        shell: pwsh
        run: |
          ./crates/ytbridge/setup-python-runtime.ps1
          "PYO3_PYTHON=$((Resolve-Path vendor/python-runtime/python.exe).Path)" >> $env:GITHUB_ENV

      - name: Download verified LGPL FFmpeg SDK/runtime
        shell: pwsh
        run: |
          $manifest = Get-Content packaging/bundle-manifest.json | ConvertFrom-Json
          $ffmpeg = $manifest.native_dependencies | Where-Object name -eq "FFmpeg"
          Invoke-WebRequest $ffmpeg.windows_url -OutFile ffmpeg.zip
          $actual = (Get-FileHash ffmpeg.zip -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne $ffmpeg.windows_sha256) { throw "FFmpeg SHA-256 mismatch" }
          Expand-Archive ffmpeg.zip ffmpeg-extracted
          $inner = Get-ChildItem ffmpeg-extracted -Directory | Select-Object -First 1
          Move-Item $inner.FullName ffmpeg-dev
          "FFMPEG_DIR=$((Resolve-Path ffmpeg-dev).Path)" >> $env:GITHUB_ENV
          "$((Resolve-Path ffmpeg-dev/bin).Path)" >> $env:GITHUB_PATH

      - name: Build release binaries
        run: |
          cargo build --release --locked -p ytbridge
          cd apps/desktop
          npm ci
          npm run tauri build -- --no-bundle

      - name: Assemble and validate complete bundle
        shell: pwsh
        run: |
          $gst = $env:GSTREAMER_1_0_ROOT_MSVC_X86_64
          if (-not $gst) { throw "GStreamer root was not exported by setup-gstreamer" }
          ./packaging/assemble_windows.ps1 `
            -BuildDir target/release `
            -FfmpegDir $env:FFMPEG_DIR `
            -GStreamerDir $gst `
            -OutputDir dist/oca
          Compress-Archive -Path dist/oca/* -DestinationPath oca-x86_64-pc-windows-msvc.zip

      - name: Build Inno Setup installer from the validated bundle
        shell: pwsh
        run: |
          python packaging/tests/test_inno_i18n.py
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { throw "Pinned Inno Setup compiler is unavailable" }
          $compilerVersion = (Get-Item $iscc).VersionInfo.ProductVersion
          if (-not $compilerVersion.StartsWith("6.7.1")) {
            throw "Expected Inno Setup 6.7.1, found $compilerVersion"
          }
          $metadata = cargo metadata --no-deps --format-version 1 | ConvertFrom-Json
          $version = ($metadata.packages | Where-Object name -eq "desktop").version
          if (-not $version) { throw "Could not resolve the desktop package version" }
          $source = (Resolve-Path dist/oca).Path
          $output = Join-Path $PWD "dist\installer"
          New-Item -ItemType Directory -Force -Path $output | Out-Null
          & $iscc "/DSourceDir=$source" "/DOutputDir=$output" "/DAppVersion=$version" `
            packaging/windows-installer.iss
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup compilation failed" }
          Copy-Item (Join-Path $output "oca-x86_64-pc-windows-msvc-setup.exe") .

      - uses: actions/upload-artifact@v7
        with:
          name: windows-release
          path: |
            oca-x86_64-pc-windows-msvc.zip
            oca-x86_64-pc-windows-msvc-setup.exe
          if-no-files-found: error

  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: Install native build and GStreamer runtime
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake clang libclang-dev pkg-config patchelf \
            libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev \
            gstreamer1.0-plugins-base gstreamer1.0-plugins-good \
            gstreamer1.0-plugins-bad gstreamer1.0-plugins-ugly \
            gstreamer1.0-libav gstreamer1.0-tools gstreamer1.0-pulseaudio gstreamer1.0-alsa
      - uses: Swatinem/rust-cache@v2
      - name: Fetch locked Cargo sources for license generation
        run: cargo fetch --locked

      - name: Prepare verified private Python runtime
        run: bash ./crates/ytbridge/setup-python-runtime.sh

      - name: Download verified LGPL FFmpeg SDK/runtime
        run: |
          url=$(python3 -c 'import json; print(next(x for x in json.load(open("packaging/bundle-manifest.json"))["native_dependencies"] if x["name"] == "FFmpeg")["linux_url"])')
          expected=$(python3 -c 'import json; print(next(x for x in json.load(open("packaging/bundle-manifest.json"))["native_dependencies"] if x["name"] == "FFmpeg")["linux_sha256"])')
          curl -fL "$url" -o ffmpeg.tar.xz
          echo "$expected  ffmpeg.tar.xz" | sha256sum --check
          tar -xf ffmpeg.tar.xz
          mv ffmpeg-* ffmpeg-dev
          echo "FFMPEG_DIR=$PWD/ffmpeg-dev" >> "$GITHUB_ENV"
          echo "LD_LIBRARY_PATH=$PWD/ffmpeg-dev/lib" >> "$GITHUB_ENV"
          echo "PYO3_PYTHON=$PWD/vendor/python-runtime/bin/python3.10" >> "$GITHUB_ENV"

      - name: Build release binaries
        run: |
          cargo build --release --locked -p ytbridge
          cd apps/desktop
          npm ci
          npm run tauri build -- --no-bundle

      - name: Assemble and validate complete portable tree
        run: |
          ./packaging/assemble_linux.sh target/release "$FFMPEG_DIR" dist/oca
          tar -C dist/oca -czf oca-x86_64-unknown-linux-gnu.tar.gz .

      - name: Build and validate Debian package
        run: |
          version=$(cargo metadata --no-deps --format-version 1 \
            | python3 -c 'import json,sys; print(next(p["version"] for p in json.load(sys.stdin)["packages"] if p["name"] == "desktop"))')
          SOURCE_DATE_EPOCH="$(git log -1 --format=%ct)"
          export SOURCE_DATE_EPOCH
          python3 packaging/tests/test_deb_package.py
          ./packaging/build_deb.sh dist/oca "$version" "oca_${version}_amd64.deb"
          python3 packaging/validate_deb.py "oca_${version}_amd64.deb" --version "$version"

      - name: Build verified AppImage
        run: |
          cp -a dist/oca dist/Oca.AppDir
          cp packaging/linux-launcher.sh dist/Oca.AppDir/AppRun
          cp packaging/oca.desktop dist/Oca.AppDir/oca.desktop
          cp logo.png dist/Oca.AppDir/oca.png
          chmod +x dist/Oca.AppDir/AppRun
          appimagetool_url=$(python3 -c 'import json; print(next(x for x in json.load(open("packaging/bundle-manifest.json"))["native_dependencies"] if x["name"] == "appimagetool")["url"])')
          appimagetool_sha=$(python3 -c 'import json; print(next(x for x in json.load(open("packaging/bundle-manifest.json"))["native_dependencies"] if x["name"] == "appimagetool")["sha256"])')
          runtime_url=$(python3 -c 'import json; print(next(x for x in json.load(open("packaging/bundle-manifest.json"))["native_dependencies"] if x["name"] == "AppImage type-2 runtime")["url"])')
          runtime_sha=$(python3 -c 'import json; print(next(x for x in json.load(open("packaging/bundle-manifest.json"))["native_dependencies"] if x["name"] == "AppImage type-2 runtime")["sha256"])')
          curl -fL "$appimagetool_url" -o appimagetool
          echo "$appimagetool_sha  appimagetool" | sha256sum --check
          curl -fL "$runtime_url" -o runtime-x86_64
          echo "$runtime_sha  runtime-x86_64" | sha256sum --check
          chmod +x appimagetool
          APPIMAGE_EXTRACT_AND_RUN=1 ARCH=x86_64 ./appimagetool \
            --runtime-file runtime-x86_64 dist/Oca.AppDir oca.AppImage
          tar -czf oca-x86_64-unknown-linux-gnu-appimage.tar.gz oca.AppImage

      - uses: actions/upload-artifact@v7
        with:
          name: linux-release
          path: |
            oca-x86_64-unknown-linux-gnu.tar.gz
            oca-x86_64-unknown-linux-gnu-appimage.tar.gz
            oca_*_amd64.deb
          if-no-files-found: error

  macos:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            architecture: arm64
            target: aarch64-apple-darwin
          - runner: macos-15-intel
            architecture: x86_64
            target: x86_64-apple-darwin
    runs-on: ${{ matrix.runner }}
    env:
      MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
      MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: Install native build and media runtimes
        run: brew install cmake gstreamer nasm openh264 pkg-config
      - uses: Swatinem/rust-cache@v2
      - name: Fetch locked Cargo sources for license generation
        run: cargo fetch --locked

      - name: Prepare verified private Python runtime
        run: bash ./crates/ytbridge/setup-python-runtime.sh

      - name: Build verified private FFmpeg runtime
        run: |
          ./packaging/build_macos_ffmpeg.sh "$PWD/ffmpeg-dev"
          echo "FFMPEG_DIR=$PWD/ffmpeg-dev" >> "$GITHUB_ENV"
          brew_prefix="$(brew --prefix)"
          echo "GSTREAMER_DIR=$(brew --prefix gstreamer)" >> "$GITHUB_ENV"
          echo "PKG_CONFIG_PATH=${brew_prefix}/lib/pkgconfig" >> "$GITHUB_ENV"
          echo "PYO3_PYTHON=$PWD/vendor/python-runtime/bin/python3.10" >> "$GITHUB_ENV"

      - name: Import optional Developer ID certificate
        run: |
          if [ -z "$MACOS_CERTIFICATE" ] || [ -z "$MACOS_CERTIFICATE_PASSWORD" ]; then
            echo "No Developer ID certificate configured; using ad-hoc signing."
            exit 0
          fi
          certificate="$RUNNER_TEMP/oca-developer-id.p12"
          keychain="$RUNNER_TEMP/oca-signing.keychain-db"
          keychain_password="$(openssl rand -hex 24)"
          printf '%s' "$MACOS_CERTIFICATE" | base64 --decode > "$certificate"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$certificate" -P "$MACOS_CERTIFICATE_PASSWORD" \
            -A -t cert -f pkcs12 -k "$keychain"
          security set-key-partition-list -S apple-tool:,apple: \
            -s -k "$keychain_password" "$keychain"
          security list-keychains -d user -s "$keychain" login.keychain-db
          identity="$(security find-identity -v -p codesigning "$keychain" \
            | sed -n 's/.*"\(Developer ID Application:.*\)"/\1/p' | head -1)"
          [ -n "$identity" ] || { echo "Developer ID Application identity not found" >&2; exit 1; }
          echo "OCA_CODESIGN_IDENTITY=$identity" >> "$GITHUB_ENV"

      - name: Build release binaries
        run: |
          cargo build --release --locked -p ytbridge
          cd apps/desktop
          npm ci
          npm run tauri build -- --no-bundle

      - name: Assemble and validate macOS application
        run: |
          version=$(cargo metadata --no-deps --format-version 1 \
            | python3 -c 'import json,sys; print(next(p["version"] for p in json.load(sys.stdin)["packages"] if p["name"] == "desktop"))')
          mkdir -p dist/macos
          ./packaging/assemble_macos.sh \
            target/release "$FFMPEG_DIR" "$GSTREAMER_DIR" \
            vendor/python-runtime dist/macos/Oca.app \
            dist/macos/DEPENDENCIES.json "$version" "${{ matrix.architecture }}"
          ./packaging/build_dmg.sh \
            dist/macos/Oca.app dist/macos/DEPENDENCIES.json \
            "oca-${{ matrix.target }}.dmg"

      - name: Sign and optionally notarize disk image
        run: |
          asset="oca-${{ matrix.target }}.dmg"
          if [ -n "${OCA_CODESIGN_IDENTITY:-}" ]; then
            codesign --force --timestamp --sign "$OCA_CODESIGN_IDENTITY" "$asset"
          fi
          if [ -z "$APPLE_ID" ] || [ -z "$APPLE_APP_SPECIFIC_PASSWORD" ] \
            || [ -z "$APPLE_TEAM_ID" ] || [ -z "${OCA_CODESIGN_IDENTITY:-}" ]; then
            echo "Apple notarization credentials are incomplete; publishing the validated DMG without notarization."
            exit 0
          fi
          xcrun notarytool submit "$asset" --wait \
            --apple-id "$APPLE_ID" \
            --password "$APPLE_APP_SPECIFIC_PASSWORD" \
            --team-id "$APPLE_TEAM_ID"
          xcrun stapler staple "$asset"
          xcrun stapler validate "$asset"

      - uses: actions/upload-artifact@v7
        with:
          name: macos-${{ matrix.architecture }}-release
          path: oca-${{ matrix.target }}.dmg
          if-no-files-found: error

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, linux, macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: "*-release"
          merge-multiple: true
      - name: Publish immutable release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" \
            --verify-tag --generate-notes \
            oca-x86_64-pc-windows-msvc.zip \
            oca-x86_64-pc-windows-msvc-setup.exe \
            oca-x86_64-unknown-linux-gnu.tar.gz \
            oca-x86_64-unknown-linux-gnu-appimage.tar.gz \
            oca_*_amd64.deb \
            oca-aarch64-apple-darwin.dmg \
            oca-x86_64-apple-darwin.dmg
