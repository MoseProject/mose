[workspace]
resolver = "2"
members = [
    "crates/bush",
    "crates/core",
    "crates/avbridge",
    "crates/ytbridge",
    "apps/desktop/src-tauri",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
