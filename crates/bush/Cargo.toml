[package]
name = "bush"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
avbridge = { path = "../avbridge" }
cpal = { version = "0.18.2", optional = true }
pollster = { version = "1.0.1", optional = true }
wgpu = { version = "30.0.1", default-features = false, features = ["wgsl", "dx12", "vulkan-portability", "metal"], optional = true }

[dev-dependencies]
criterion = "0.8.2"

[[bench]]
name = "editor_workloads"
harness = false

[[bench]]
name = "engine_workloads"
harness = false

[features]
cpal = ["dep:cpal"]
gpu = ["dep:wgpu", "dep:pollster"]
