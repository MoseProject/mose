[package]
name = "core"
version.workspace = true
edition.workspace = true
license.workspace = true

# Rust code imports this crate as `avcore`, not the bare package name `core` — a dependency
# literally named `core` shadows the sysroot `core` crate (verified: `use core::mem::...`
# resolves to this crate instead of libcore, breaking basically everything that needs it).
# The package (and this directory) stay named `core` for `cargo -p core`/Cargo.toml
# readability; only the Rust-side import name is different. See CLAUDE.md.
[lib]
name = "avcore"

[dependencies]
gstreamer = "0.25.3"
gstreamer-app = "0.25.2"
gstreamer-video = "0.25.3"
avbridge = { path = "../avbridge" }
# Bush's decode-only `DecodeSource` (default features: no GPU, no audio device) is the frame
# sampler's decoder; it replaced the GStreamer pipeline `FrameSampler` used to open.
bush = { path = "../bush" }
serde = { version = "1", features = ["derive"] }
# Structured logging facade — just the macros (`warn!`/`error!`/...), no subscriber. Events
# emitted here flow into whatever global subscriber `ui`'s `main.rs::init_logging` installs
# (tracing's subscriber is process-global, not per-crate), same rolling daily log file every
# other logged event already goes to. Version pinned to match `ui/Cargo.toml`'s.
tracing = "0.1"
serde_json = "1.0.151"
# .ocproj project file format: MessagePack in struct-map mode (keeps field names, unlike
# rmp-serde's default compact/array mode) so `#[serde(default)]` keeps working for a field
# added to Project/ClipInstance/etc. after a project was last saved — the same
# schema-evolution guarantee JSON gave, just binary. gzip-compressed on top for size/speed.
rmp-serde = "1"
# Atomic `.ocqueue` writes (`export_queue`) -- same crate and version the egui shell already uses.
tempfile = "3.27.0"
flate2 = "1"
# CPU-only (default features) — no cuda/hipblas/metal/vulkan. Needs LIBCLANG_PATH set at build
# time (bindgen dependency) and outside a %TEMP%-rooted build dir on Windows (MSVC's FileTracker
# refuses FTK1011 there) — see CLAUDE.md.
whisper-rs = "0.16"
# TEXT-01A (spec/architecture/complex-text-shaping.md): bundled-only OpenType shaping/bidi/
# rasterization for `text_layout` — the sole glyph-measurement/placement path for word-highlight
# subtitles since TEXT-01A shipped (TEXT-01B step 4 removed the `fontdue`-based per-character
# advance-width predecessor once it had no remaining caller — see `text_metrics.rs`'s own doc
# comment). `default-features = false` drops the default `fontconfig` feature (a system-font-
# discovery helper this crate never wants — `text_layout::TextLayoutEngine` builds its own
# `fontdb::Database` from `font_catalog`'s own locked bytes only, never `FontSystem::new()`/system
# fonts); `swash` is needed for rasterization. Confirmed pure-Rust with this feature set (harfrust/
# skrifa/swash/fontdb/unicode-bidi, no C toolchain) via the acceptance spike this module's doc
# comment records.
cosmic-text = { version = "0.19", default-features = false, features = ["std", "swash"] }
# UAX #9 P2/P3 first-strong-character paragraph-direction detection for `TextAlign::Start`/`::End`
# (TEXT-01B) — already a transitive dependency of `cosmic-text` itself (same version this pins),
# so this adds no new dependency tree, just a direct name for `get_base_direction`.
unicode-bidi = "0.3"
# TEXT-01's own automatic script-fallback chain: `cosmic_text::Fallback::script_fallback` takes a
# `unicode_script::Script` to name which bundled international family a `.notdef` cluster should
# retry against. Already a transitive dependency of `cosmic-text` itself (same version this pins),
# so this adds no new dependency tree either — same reasoning as `unicode-bidi` above.
unicode-script = "0.5"
# Encodes the shared Rust text rasterizer's full-canvas RGBA buffers as temporary PNG overlays
# for the native export post-pass. PNG is the only enabled codec; preview consumes the same
# buffers directly without encoding them.
image = { version = "0.25.10", default-features = false, features = ["png"] }
# Blocking HTTP client used only for the explicit GitHub release update check. Models and
# runtimes are never fetched by the application; release assembly supplies those locally.
ureq = "3"
# In-place GitHub Releases updater. Both archive formats are enabled because published Windows
# builds use zip while Linux builds use tar.gz. The ureq + rustls path reuses the workspace's
# pure-Rust HTTP/TLS stack instead of introducing OpenSSL or a second blocking HTTP client.
self_update = { version = "0.44", default-features = false, features = ["ureq", "rustls", "archive-tar", "archive-zip", "compression-flate2", "compression-zip-deflate"] }
# ONNX Runtime bindings for auto-reframe's face-detection model (see `auto_reframe`).
# `download-binaries` fetches a checksum-pinned ONNX Runtime archive at build time; this feature
# set statically links it, so release bundles need no separate ONNX Runtime DLL/shared object.
ort = { version = "2.0.0-rc.13", features = ["download-binaries"] }
# Text-to-speech (`text_to_speech`): espeak-ng phonemization for Piper voice models. Builds
# espeak-ng from vendored C source via cmake (needs CMake + LIBCLANG_PATH — bindgen — on the
# build machine, same class of requirement as whisper-rs), statically linked (no runtime DLL).
# Needs its `espeak-ng-data` directory discoverable at runtime — `build.rs` copies it next to
# the workspace's build output; see that file's doc comment.
espeak-rs = "0.2"
# Splits an espeak IPA phoneme string into individual symbols by Unicode grapheme cluster
# (not `char`), so a base letter plus a combining stress/length diacritic stays one phoneme
# symbol — required for correct lookup against a Piper voice's `phoneme_id_map`.
unicode-segmentation = "1"
# Writes synthesized audio to a plain WAV file for text_to_speech's output.
hound = "3"
# CPU/RAM sampling for telemetry's `ResourceUsage` event (`request.md`'s "uso de CPU/RAM/GPU"
# wishlist). Default features only (no unneeded per-process listing).
sysinfo = "0.39"
# GPU utilization/VRAM sampling for telemetry's `GpuUsage` event (`request.md`'s "uso de
# CPU/RAM/GPU" wishlist, the GPU half sysinfo above can't cover — no cross-platform reader
# exists there). NVIDIA-only via the NVIDIA Management Library; dynamically loads
# libnvidia-ml.so/nvml.dll at runtime via `libloading` rather than link-time linking against
# it (confirmed in a throwaway scratch crate: builds and runs cleanly on a machine with no
# NVIDIA GPU/driver at all, `Nvml::init()` just returns an `Err` there), so this never turns
# into a build-time hard requirement the way a statically-linked vendor SDK would.
nvml-wrapper = "0.13"
# D7's collaboration-bundle archive format (`collab_bundle`). `default-features = false` since
# every entry this crate ever writes (already-gzip-compressed `.ocproj` bytes, already-encoded
# proxy `.mp4`s) is incompressible in practice -- `CompressionMethod::Stored` is used explicitly,
# so none of zip's optional codecs (deflate/bzip2/lzma/zstd/xz/aes-crypto/ppmd) are needed.
zip = { version = "8", default-features = false }
# Ordered-pattern scrubbing for `error_reporting`'s sanitizer (drives, home dirs, URLs,
# credentials). Already in the workspace's Cargo.lock as a transitive dependency — no new
# versions/resolution needed just for this.
regex = "1.13"

[build-dependencies]
# Not called directly by build.rs — listing it here forces Cargo to build espeak-rs-sys's own
# build script (which populates its OUT_DIR's espeak-ng-data) before core's build.rs runs,
# since build script *compilation* order otherwise has no dependency on a crate's normal
# (non-build) dependencies. Without this, build.rs can run before espeak-rs-sys exists at all.
espeak-rs-sys = "0.2"

[dev-dependencies]
criterion = "0.8.2"
# Only for persistence_test.rs's defaulting test: hand-edits a decoded MessagePack map the
# same way the previous JSON test hand-edited a serde_json::Value.
rmpv = "1"
# Only for font_catalog's own tests: verifying the locked manifest's SHA-256 hashes actually
# match the bundled font bytes (spec/architecture/built-in-font-catalog.md's "verify SHA-256"
# requirement). Hashing belongs in CI/tests, not the shipped binary — see that doc's security
# section ("parse in CI and isolated tests, not in the privileged acquisition process").
sha2 = "0.11"
# Only for persistence_test.rs's decompression-bomb-cap test: builds a raw gzip stream by hand
# (bypassing to_ocproj_bytes) so the test can assert on the framing internals directly.
flate2 = "1"

[[bench]]
name = "parsing"
harness = false
