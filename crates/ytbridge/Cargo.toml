[package]
name = "ytbridge"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

# A standalone binary, deliberately kept out of `core`/`ui`'s dependency graph — see
# `src/main.rs`'s module doc for why embedding Python directly into the GUI binary (an earlier
# version of this feature) was a real regression: `ui.exe` itself failed to launch on any
# machine without a matching Python installed, not just this one feature. Isolating the pyo3
# dependency in its own process, spawned only when the download feature is actually used,
# keeps `ui.exe` launchable regardless of whether Python is present.
[dependencies]
pyo3 = { version = "0.30", features = ["auto-initialize"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1.0.151"
